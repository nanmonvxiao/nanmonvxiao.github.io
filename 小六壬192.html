<div id="access-gate" style="
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 999999;
    background: #ffffff; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    touch-action: none; overscroll-behavior: none;
">
    <div style="text-align: center; color: #333;">
        <h2 style="margin-bottom: 24px; font-weight: 300; letter-spacing: 2px; color: #222;">🔒 访问验证</h2>
        <input id="gate-pwd" type="password" placeholder="请输入访问密码"
            style="padding: 12px 20px; font-size: 18px; border: 2px solid #ddd; border-radius: 8px;
                   background: #f9f9f9; color: #333; outline: none; width: 260px; text-align: center;"
            onkeydown="if(event.key==='Enter') document.getElementById('gate-btn').click()">
        <button id="gate-btn" onclick="verifyGate()"
            style="margin-top: 16px; padding: 12px 40px; font-size: 16px; border: none; border-radius: 8px;
                   background: #333; color: #fff; cursor: pointer; transition: background 0.2s;"
            onmouseover="this.style.background='#000'" onmouseout="this.style.background='#333'">
            验 证
        </button>
        <p id="gate-msg" style="margin-top: 12px; height: 20px; color: #e74c3c; font-size: 14px;"></p>
    </div>
</div>

<script>
(function() {
    var PASSWORD = '1';
    var STORAGE_KEY = 'site_access_verified';

    if (sessionStorage.getItem(STORAGE_KEY) === 'true') {
        var gate = document.getElementById('access-gate');
        if (gate) gate.remove();
        return;
    }

    document.body.style.overflow = 'hidden';

    window.verifyGate = function() {
        var input = document.getElementById('gate-pwd');
        var msg = document.getElementById('gate-msg');
        if (input.value === PASSWORD) {
            sessionStorage.setItem(STORAGE_KEY, 'true');
            document.body.style.overflow = '';
            var gate = document.getElementById('access-gate');
            gate.style.transition = 'opacity 0.3s';
            gate.style.opacity = '0';
            setTimeout(function() { gate.remove(); }, 300);
        } else {
            msg.textContent = '❌ 密码错误，请重试';
            input.value = '';
            input.focus();
            input.style.borderColor = '#e74c3c';
            setTimeout(function() { input.style.borderColor = '#ddd'; }, 1000);
        }
    };

    document.getElementById('gate-pwd').focus();
})();
</script>
