<html><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8"><style>BODY{font-family:宋体;}INPUT{color:#000000;border:#FF9900 1px solid;border-radius:0;-webkit-appearance:none;/*解决iphone safari上的圆角问题*/background-color:#FFF8EC;font-family:宋体;padding:0px;}table.main{border:1px solid #FF9900;width:151px;height:160px;background-color:#FF9900;}table.dragbar{border-top:1px solid #FF9900;border-left:1px solid #FF9900;border-right:1px solid #FFFFFF;border-bottom:1px solid #FFFFFF;}table.head{background-color:#FFFFFF;}td.head{background-color:#FFFFFF;}span.year{z-index: 9999;position:absolute;top:3px;left:20px;border: 1px solid #FF9900}table.year{width:58px;height:140px;background-color:#FF9900;cursor:default;}span.month{z-index: 9999;position: absolute;top: 3px;left: 81px;border:#FF9900 1px solid}table.month{width:50px;height:168px;background-color:#FF9900;cursor:default;}TD{font-size: 12px;}a{color:#000000;}table.datecell{border-top:1px solid #FF9900;border-left:1px solid #FF9900;border-right:1px solid #FFFFFF;border-bottom:1px solid #FFFFFF;}TD.calendarhead{color: #000000; background-color: #FFFFFF;border:1px solid #FFFFFF;}TD.mouseoverYM{text-align:center;color: #000000; background-color: #FFD700;}td.normalYM{text-align:center;color:#000000;background-color:#E0E0E0;}td.selectedYM{text-align:center;color:#000000;background-color:#00FFFF;}TD.dragbar{font-size:12px;color:#FFFFFF;width:21px;border-bottom:1px solid #FF9900;border-right:1px solid #FF9900;border-left:1px solid #FFFFFF;border-top:1px solid #FFFFFF;}TD.mouseover{color: #000000; background-color: #FFD700;border:1px solid #FF9900;}TD.normalday,TD.grayday,TD.today,TD.graytoday{border-left:1px solid #FFFFFF;border-top:1px solid #FFFFFF;border-right:1px solid #FF9900;border-bottom:1px solid #FF9900;}TD.selectedday,TD.selectedgrayday{border-left:1px solid #FF9900;border-top:1px solid #FF9900;border-right:1px solid #FFFFFF;border-bottom:1px solid #FFFFFF;}TD.normalday{color:#000000;background-color:#E0E0E0;}TD.grayday{color:#808080;background-color:#E0E0E0;}TD.today{color:#000000;background-color:#FFD700;}TD.selectedday{color:#000000;background-color:#00FFFF;}TD.selectedgrayday{color:#808080;background-color:#00FFFF;}TD.graytoday{color:#808080;background-color:#FFD700;}</style><script>if(window.addEventListener){parent.wpEvents.initWinEvents(window);}	/*解决兼容ff事件的问题*/var datelayerx,datelayery;	/*存放日历控件的鼠标位置*/var bDrag=false;	/*标记是否开始拖动*/var DateLayer=parent.wpCalendar.Style;document.onmousemove=function()	/*在鼠标移动事件中，如果开始拖动日历，则移动日历*/{if(bDrag){		DateLayer.left = (parseInt(DateLayer.left)+window.event.clientX-datelayerx)+"px";/*由于每次移动以后鼠标位置都恢复为初始的位置，因此写法与div中不同*/		DateLayer.top = (parseInt(DateLayer.top)+window.event.clientY-datelayery)+"px";}};function DragStart(){		/*开始日历拖动*/	if(window.event.button==parent.wpConsts.MouseButton.LEFTBUTTON){		datelayerx=window.event.clientX;		datelayery=window.event.clientY;		bDrag=true;}}function DragEnd(){		/*结束日历拖动*/	bDrag=false;}document.onmousedown=function(){	/*点击的时候关闭年份和月份的选择列表*/	var obj=document.getElementById("tmpSelectYearLayer");if(!bFromYear&&event.srcElement!=document.getElementById("CalendarYearHead")&&obj.style.display!="none"){obj.style.display="none";bYearListOpening=true}	obj=document.getElementById("tmpSelectMonthLayer");if(event.srcElement!=document.getElementById("CalendarMonthHead")&&obj.style.display!="none")obj.style.display="none";};var strTempClass="";document.oncontextmenu=function(){if(!event.ctrlKey)return false;};	/*禁止出现右键菜单*/function mOver(obj){strTempClass=obj.className;obj.className="mouseoverYM";bYearListOpening=false;/*为了显示年份列表的时候向上滚动功能的正常使用*/}/*年/月选择列表的mouseover处理*/function mOut(obj){obj.className=strTempClass;}/*年/月选择列表的mouseout处理*/function setMonth(iMonth){parent.wpCalendar.setMonth(iMonth)}/*下拉选择月份的处理*/function setYear(iYear){parent.wpCalendar.setYear(iYear)}/*下拉选择年份的处理*/var bScrolling=false;var bYearListOpening=true;/*这个变量用于控制在刚刚显示年份列表的时候，鼠标处于向上滚动条位置的情况下不要滚动*/var iScroll=null;var bFromYear=false;	/*标志为从年份下拉列表处进行了点击，以便不要关闭年份列表*/function scrollYear(bUp){	var oTable=document.getElementById("tmpSelectYearLayer").childNodes[0];	if(bUp){		var iMin=parseInt(oTable.rows[1].cells[0].innerHTML.replace(/\D/g,''));		if(iMin>1000){oTable.deleteRow(oTable.rows.length-2);var oTd=oTable.insertRow(1).insertCell(0);			oTd.innerHTML=(iMin-1).toString()+" 年";oTd.onmouseover=Function("mOver(this)");oTd.onmouseout=Function("mOut(this)");			oTd.onmousedown=Function("setYear("+(iMin-1).toString()+")");oTd.className=(iMin-1==parent.wpCalendar.year?"selectedYM":"normalYM");			if(bScrolling)window.setTimeout("scrollYear(true)", 100);}}	else{		var iMax=parseInt(oTable.rows[oTable.rows.length-2].cells[0].innerHTML.replace(/\D/g,''));		if(iMax<=9999){var oTd=oTable.insertRow(oTable.rows.length-1).insertCell(0);oTable.deleteRow(1);			oTd.innerHTML=(iMax+1).toString()+" 年";oTd.onmouseover=Function("mOver(this)");oTd.onmouseout=Function("mOut(this)");			oTd.onmousedown=Function("setYear("+(iMax+1).toString()+")");oTd.className=(iMax+1==parent.wpCalendar.year?"selectedYM":"normalYM");			if(bScrolling)window.setTimeout("scrollYear(false)", 100);}}}function startScroll(oTd,bUp){bFromYear=true;if(!bYearListOpening){bScrolling=true;scrollYear(bUp);}}function stopScroll(){bYearListOpening=false;bFromYear=false;bScrolling=false;if(iScroll)clearTimeout(iScroll);}</script></head><body><div style="z-index:9999;position: absolute; left:0; top:0;" onselectstart="return false"><span id="tmpSelectYearLayer" class="year" style="display: none;"></span><span id="tmpSelectMonthLayer" class="month" style="display: none;"></span><table border="1" cellspacing="0" cellpadding="0" bordercolor="#FF9900" class="main">  <tbody><tr><td width="151" height="20" class="head"><table border="0" cellspacing="1" cellpadding="0" width="149" height="20">      <tbody><tr align="center"><td width="16"><input title="向前翻 1 月" type="button" value="&lt;" onclick="parent.wpCalendar.goPrevMonth()" ondblclick="parent.wpCalendar.goPr
